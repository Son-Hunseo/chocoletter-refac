name: Client - Build & Push to Harbor and Update GitOps deploy tag

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "chocoletter-client/**"

permissions:
  contents: write

jobs:
  build-push-update:
    # GitOps 리소스 푸시로 다시 재귀적으로 트리거되어 무한으로 호출되는 것을 막음
    if: github.actor != 'github-actions[bot]'
    runs-on: my-chocoletter-runner

    env:
      HARBOR_REGISTRY: harbor.onprem.local
      HARBOR_PROJECT: son
      HARBOR_SCHEME: https
      DEPLOY_FILE_BEFORE: client/overlays/onprem/prod/kustomization.yaml
      DEPLOY_FILE_AFTER: client/overlays/onprem/after/kustomization.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          echo "${HARBOR_PASSWORD}" | docker login "${HARBOR_REGISTRY}" \
            --username "${HARBOR_USERNAME}" \
            --password-stdin

      - name: Calculate next image tag (before)
        id: next_tag_before
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          HARBOR_REPOSITORY="chocoletter-client"
          IMAGE_REPOSITORY="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${HARBOR_REPOSITORY}"
          JSON="$(curl -kfsSL \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            "${HARBOR_SCHEME}://${HARBOR_REGISTRY}/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${HARBOR_REPOSITORY}/artifacts?page_size=100")"

          NEXT_TAG="$(echo "$JSON" | python3 .github/scripts/calc_next_tag.py)"
          echo "NEXT_TAG_BEFORE=${NEXT_TAG}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY_BEFORE=${IMAGE_REPOSITORY}" >> $GITHUB_ENV

      - name: Build & Push Docker image (before)
        run: |
          IMAGE_NAME="chocoletter-client-image"
          docker build --network host -t ${IMAGE_NAME}:${NEXT_TAG_BEFORE} -f ./chocoletter-client/Dockerfile ./chocoletter-client
          docker tag ${IMAGE_NAME}:${NEXT_TAG_BEFORE} ${IMAGE_REPOSITORY_BEFORE}:${NEXT_TAG_BEFORE}
          docker push ${IMAGE_REPOSITORY_BEFORE}:${NEXT_TAG_BEFORE}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Son-Hunseo/chocoletter-gitops
          token: ${{ secrets.CHOCOLETTER_GITOPS_TOKEN }}
          path: chocoletter-gitops

      - name: Update prod kustomization.yaml image tag
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("chocoletter-gitops") / os.environ["DEPLOY_FILE_BEFORE"]
          target = "chocoletter-client-image"
          tag = os.environ["NEXT_TAG_BEFORE"]
          lines = path.read_text().splitlines()
          in_target = False

          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped == f"- name: {target}":
                  in_target = True
                  continue
              if in_target and stripped.startswith("- name: "):
                  break
              if in_target and stripped.startswith("newTag:"):
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[i] = f'{indent}newTag: "{tag}"'
                  path.write_text("\n".join(lines) + "\n")
                  break
          else:
              raise SystemExit(f"newTag for {target} not found in {path}")
          PY

      - name: Calculate next image tag (after)
        id: next_tag_after
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          HARBOR_REPOSITORY="chocoletter-client-after"
          IMAGE_REPOSITORY="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${HARBOR_REPOSITORY}"
          JSON="$(curl -kfsSL \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            "${HARBOR_SCHEME}://${HARBOR_REGISTRY}/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${HARBOR_REPOSITORY}/artifacts?page_size=100")"

          NEXT_TAG="$(echo "$JSON" | python3 .github/scripts/calc_next_tag.py)"
          echo "NEXT_TAG_AFTER=${NEXT_TAG}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY_AFTER=${IMAGE_REPOSITORY}" >> $GITHUB_ENV

      - name: Build & Push Docker image (after)
        run: |
          IMAGE_NAME="chocoletter-client-after-image"
          docker build --network host -t ${IMAGE_NAME}:${NEXT_TAG_AFTER} -f ./chocoletter-client/Dockerfile.after ./chocoletter-client
          docker tag ${IMAGE_NAME}:${NEXT_TAG_AFTER} ${IMAGE_REPOSITORY_AFTER}:${NEXT_TAG_AFTER}
          docker push ${IMAGE_REPOSITORY_AFTER}:${NEXT_TAG_AFTER}

      - name: Update after kustomization.yaml image tag
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("chocoletter-gitops") / os.environ["DEPLOY_FILE_AFTER"]
          target = "chocoletter-client-image"
          tag = os.environ["NEXT_TAG_AFTER"]
          lines = path.read_text().splitlines()
          in_target = False

          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped == f"- name: {target}":
                  in_target = True
                  continue
              if in_target and stripped.startswith("- name: "):
                  break
              if in_target and stripped.startswith("newTag:"):
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[i] = f'{indent}newTag: "{tag}"'
                  path.write_text("\n".join(lines) + "\n")
                  break
          else:
              raise SystemExit(f"newTag for {target} not found in {path}")
          PY

      - name: Commit and push GitOps manifest
        run: |
          cd chocoletter-gitops
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add "${DEPLOY_FILE_BEFORE}" "${DEPLOY_FILE_AFTER}"
          git commit -m "chore(gitops): bump client image tags to before:${NEXT_TAG_BEFORE}, after:${NEXT_TAG_AFTER}" || exit 0
          git push
