name: Client - Build & Push and Update GitOps deploy tag

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "chocoletter-client/**"

permissions:
  contents: write
  id-token: write

jobs:
  deploy-onprem:
    if: ${{ (vars.ENABLE_ONPREM || 'false') == 'true' && github.actor != 'github-actions[bot]' }}
    runs-on: my-chocoletter-runner

    env:
      HARBOR_REGISTRY: harbor.onprem.local
      HARBOR_PROJECT: son
      HARBOR_SCHEME: https
      DEPLOY_FILE_BEFORE: client/overlays/onprem/prod/kustomization.yaml
      DEPLOY_FILE_AFTER: client/overlays/onprem/after/kustomization.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          echo "${HARBOR_PASSWORD}" | docker login "${HARBOR_REGISTRY}"             --username "${HARBOR_USERNAME}"             --password-stdin

      - name: Calculate next image tag (before)
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          HARBOR_REPOSITORY="chocoletter-client"
          IMAGE_REPOSITORY="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${HARBOR_REPOSITORY}"
          JSON="$(curl -kfsSL             -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}"             "${HARBOR_SCHEME}://${HARBOR_REGISTRY}/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${HARBOR_REPOSITORY}/artifacts?page_size=100")"
          NEXT_TAG="$(echo "$JSON" | python3 .github/scripts/calc_next_tag.py)"
          echo "NEXT_TAG_BEFORE=${NEXT_TAG}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY_BEFORE=${IMAGE_REPOSITORY}" >> $GITHUB_ENV

      - name: Build and push Docker image (before)
        run: |
          docker build --network host -t "chocoletter-client-image:${NEXT_TAG_BEFORE}" -f ./chocoletter-client/Dockerfile ./chocoletter-client
          docker tag "chocoletter-client-image:${NEXT_TAG_BEFORE}" "${IMAGE_REPOSITORY_BEFORE}:${NEXT_TAG_BEFORE}"
          docker push "${IMAGE_REPOSITORY_BEFORE}:${NEXT_TAG_BEFORE}"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Son-Hunseo/chocoletter-gitops
          token: ${{ secrets.CHOCOLETTER_GITOPS_TOKEN }}
          path: chocoletter-gitops

      - name: Update prod kustomization image
        run: |
          python3 .github/scripts/update_kustomize_image.py             "chocoletter-gitops/${DEPLOY_FILE_BEFORE}"             --image "chocoletter-client-image"             --new-name "${IMAGE_REPOSITORY_BEFORE}"             --new-tag "${NEXT_TAG_BEFORE}"

      - name: Calculate next image tag (after)
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          HARBOR_REPOSITORY="chocoletter-client-after"
          IMAGE_REPOSITORY="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${HARBOR_REPOSITORY}"
          JSON="$(curl -kfsSL             -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}"             "${HARBOR_SCHEME}://${HARBOR_REGISTRY}/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${HARBOR_REPOSITORY}/artifacts?page_size=100")"
          NEXT_TAG="$(echo "$JSON" | python3 .github/scripts/calc_next_tag.py)"
          echo "NEXT_TAG_AFTER=${NEXT_TAG}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY_AFTER=${IMAGE_REPOSITORY}" >> $GITHUB_ENV

      - name: Build and push Docker image (after)
        run: |
          docker build --network host -t "chocoletter-client-after-image:${NEXT_TAG_AFTER}" -f ./chocoletter-client/Dockerfile.after ./chocoletter-client
          docker tag "chocoletter-client-after-image:${NEXT_TAG_AFTER}" "${IMAGE_REPOSITORY_AFTER}:${NEXT_TAG_AFTER}"
          docker push "${IMAGE_REPOSITORY_AFTER}:${NEXT_TAG_AFTER}"

      - name: Update after kustomization image
        run: |
          python3 .github/scripts/update_kustomize_image.py             "chocoletter-gitops/${DEPLOY_FILE_AFTER}"             --image "chocoletter-client-image"             --new-name "${IMAGE_REPOSITORY_AFTER}"             --new-tag "${NEXT_TAG_AFTER}"

      - name: Commit and push GitOps manifest
        run: |
          cd chocoletter-gitops
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add "${DEPLOY_FILE_BEFORE}" "${DEPLOY_FILE_AFTER}"
          git commit -m "chore(gitops): bump client image tags to before:${NEXT_TAG_BEFORE}, after:${NEXT_TAG_AFTER}" || exit 0
          git push

  deploy-aws:
    if: ${{ (vars.ENABLE_AWS || 'true') == 'true' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      DEPLOY_FILE_BEFORE: client/overlays/aws/prod/kustomization.yaml
      DEPLOY_FILE_AFTER: client/overlays/aws/after/kustomization.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Calculate next image tag (before)
        run: |
          ECR_REPOSITORY="chocoletter-client"
          IMAGE_REPOSITORY="${{ steps.ecr_login.outputs.registry }}/${ECR_REPOSITORY}"
          JSON="$(aws ecr describe-images             --region "${AWS_REGION}"             --repository-name "${ECR_REPOSITORY}"             --query 'imageDetails[].imageTags[]'             --output json 2>/dev/null || echo '[]')"
          NEXT_TAG="$(echo "$JSON" | python3 .github/scripts/calc_next_tag.py)"
          echo "NEXT_TAG_BEFORE=${NEXT_TAG}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY_BEFORE=${IMAGE_REPOSITORY}" >> $GITHUB_ENV

      - name: Build and push Docker image (before)
        run: |
          docker build --network host -t "chocoletter-client-image:${NEXT_TAG_BEFORE}" -f ./chocoletter-client/Dockerfile ./chocoletter-client
          docker tag "chocoletter-client-image:${NEXT_TAG_BEFORE}" "${IMAGE_REPOSITORY_BEFORE}:${NEXT_TAG_BEFORE}"
          docker push "${IMAGE_REPOSITORY_BEFORE}:${NEXT_TAG_BEFORE}"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Son-Hunseo/chocoletter-gitops
          token: ${{ secrets.CHOCOLETTER_GITOPS_TOKEN }}
          path: chocoletter-gitops

      - name: Update prod kustomization image
        run: |
          python3 .github/scripts/update_kustomize_image.py             "chocoletter-gitops/${DEPLOY_FILE_BEFORE}"             --image "chocoletter-client-image"             --new-name "${IMAGE_REPOSITORY_BEFORE}"             --new-tag "${NEXT_TAG_BEFORE}"

      - name: Calculate next image tag (after)
        run: |
          ECR_REPOSITORY="chocoletter-client-after"
          IMAGE_REPOSITORY="${{ steps.ecr_login.outputs.registry }}/${ECR_REPOSITORY}"
          JSON="$(aws ecr describe-images             --region "${AWS_REGION}"             --repository-name "${ECR_REPOSITORY}"             --query 'imageDetails[].imageTags[]'             --output json 2>/dev/null || echo '[]')"
          NEXT_TAG="$(echo "$JSON" | python3 .github/scripts/calc_next_tag.py)"
          echo "NEXT_TAG_AFTER=${NEXT_TAG}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY_AFTER=${IMAGE_REPOSITORY}" >> $GITHUB_ENV

      - name: Build and push Docker image (after)
        run: |
          docker build --network host -t "chocoletter-client-after-image:${NEXT_TAG_AFTER}" -f ./chocoletter-client/Dockerfile.after ./chocoletter-client
          docker tag "chocoletter-client-after-image:${NEXT_TAG_AFTER}" "${IMAGE_REPOSITORY_AFTER}:${NEXT_TAG_AFTER}"
          docker push "${IMAGE_REPOSITORY_AFTER}:${NEXT_TAG_AFTER}"

      - name: Update after kustomization image
        run: |
          python3 .github/scripts/update_kustomize_image.py             "chocoletter-gitops/${DEPLOY_FILE_AFTER}"             --image "chocoletter-client-image"             --new-name "${IMAGE_REPOSITORY_AFTER}"             --new-tag "${NEXT_TAG_AFTER}"

      - name: Commit and push GitOps manifest
        run: |
          cd chocoletter-gitops
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add "${DEPLOY_FILE_BEFORE}" "${DEPLOY_FILE_AFTER}"
          git commit -m "chore(gitops): bump AWS client image tags to before:${NEXT_TAG_BEFORE}, after:${NEXT_TAG_AFTER}" || exit 0
          git push
