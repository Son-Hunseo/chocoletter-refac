name: Server - Build & Push to Harbor and Update k8s deploy tag

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "chocoletter-server/**"

permissions:
  contents: write

jobs:
  build-push-update:
    # k8s 리소스 푸시로 다시 재귀적으로 트리거되어 무한으로 호출되는 것을 막음
    if: github.actor != 'github-actions[bot]'
    runs-on: my-chocoletter-runner

    env:
      HARBOR_REGISTRY: harbor.onprem.local
      HARBOR_PROJECT: son
      HARBOR_SCHEME: https

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          echo "${HARBOR_PASSWORD}" | docker login "${HARBOR_REGISTRY}" \
            --username "${HARBOR_USERNAME}" \
            --password-stdin

      - name: Calculate next image tag (before)
        id: next_tag_before
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          HARBOR_REPOSITORY="chocoletter-server"
          IMAGE_REPOSITORY="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${HARBOR_REPOSITORY}"
          JSON="$(curl -kfsSL \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            "${HARBOR_SCHEME}://${HARBOR_REGISTRY}/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${HARBOR_REPOSITORY}/artifacts?page_size=100")"

          NEXT_TAG="$(echo "$JSON" | python3 .github/scripts/calc_next_tag.py)"
          echo "NEXT_TAG_BEFORE=${NEXT_TAG}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY_BEFORE=${IMAGE_REPOSITORY}" >> $GITHUB_ENV

      - name: Build & Push Docker image (before)
        run: |
          IMAGE_NAME="chocoletter-server-image"
          docker build --network host -t ${IMAGE_NAME}:${NEXT_TAG_BEFORE} -f ./chocoletter-server/Dockerfile ./chocoletter-server
          docker tag ${IMAGE_NAME}:${NEXT_TAG_BEFORE} ${IMAGE_REPOSITORY_BEFORE}:${NEXT_TAG_BEFORE}
          docker push ${IMAGE_REPOSITORY_BEFORE}:${NEXT_TAG_BEFORE}

      - name: Update kustomization.yaml image tag (before)
        run: |
          DEPLOY_FILE="chocoletter-server/k8s/overlays/prod/kustomization.yaml"
          sed -i -E \
            "s|(^[[:space:]]*newTag:[[:space:]]*).*$|\1\"${NEXT_TAG_BEFORE}\"|" \
            "${DEPLOY_FILE}"

      - name: Calculate next image tag (after)
        id: next_tag_after
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          HARBOR_REPOSITORY="chocoletter-server-after"
          IMAGE_REPOSITORY="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${HARBOR_REPOSITORY}"
          JSON="$(curl -kfsSL \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            "${HARBOR_SCHEME}://${HARBOR_REGISTRY}/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${HARBOR_REPOSITORY}/artifacts?page_size=100")"

          NEXT_TAG="$(echo "$JSON" | python3 .github/scripts/calc_next_tag.py)"
          echo "NEXT_TAG_AFTER=${NEXT_TAG}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY_AFTER=${IMAGE_REPOSITORY}" >> $GITHUB_ENV

      - name: Build & Push Docker image (after)
        run: |
          IMAGE_NAME="chocoletter-server-after-image"
          docker build --network host -t ${IMAGE_NAME}:${NEXT_TAG_AFTER} -f ./chocoletter-server/Dockerfile.after ./chocoletter-server
          docker tag ${IMAGE_NAME}:${NEXT_TAG_AFTER} ${IMAGE_REPOSITORY_AFTER}:${NEXT_TAG_AFTER}
          docker push ${IMAGE_REPOSITORY_AFTER}:${NEXT_TAG_AFTER}

      - name: Update kustomization.yaml image tag (after)
        run: |
          DEPLOY_FILE="chocoletter-server/k8s/overlays/after/kustomization.yaml"
          sed -i -E \
            "s|(^[[:space:]]*newTag:[[:space:]]*).*$|\1\"${NEXT_TAG_AFTER}\"|" \
            "${DEPLOY_FILE}"

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add chocoletter-server/k8s/overlays/prod/kustomization.yaml chocoletter-server/k8s/overlays/after/kustomization.yaml
          git commit -m "chore(k8s): bump image tag to before:${NEXT_TAG_BEFORE}, after:${NEXT_TAG_AFTER} [skip ci]" || exit 0
          git push
